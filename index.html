<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TODO List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">TODOs List</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false"> List </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Something else here</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Contact</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h2 class="text-center">TODOs List</h2>
        <form id="todoForm">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title">
                <div class="form-text">Add an item to the list.</div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" rows="3"></textarea>
            </div>

            <button  id="add" class="btn btn-primary">Add to list</button>
            <button  id="clear" class="btn btn-primary" onclick ="clearstorage()">Clear list</button>

        </form>
        <div id="items" class="my-4">
            <h2>Your Items</h2>
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">SNo</th>
                        <th scope="col">Item Title</th>
                        <th scope="col">Item Description</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateTable() {
            let tableBody = document.getElementById("tableBody");
            let itemJsonArray = localStorage.getItem('itemsJson');
            if (!itemJsonArray) {
                tableBody.innerHTML = "<tr><td colspan='4' class='text-center'>No items found</td></tr>";
                return;
            }

            itemJsonArray = JSON.parse(itemJsonArray);
            let str = "";
            itemJsonArray.forEach((element, index) => {
                str += `
                <tr>
                    <th scope="row">${index + 1}</th>
                    <td>${element[0]}</td>
                    <td>${element[1]}</td>
                    <td><button class="btn btn-sm btn-danger" onclick="deleteItem(${index})">Delete</button></td>
                </tr>`;
            });

            tableBody.innerHTML = str;
        }

        function deleteItem(index) {
            let itemJsonArray = JSON.parse(localStorage.getItem('itemsJson'));
            itemJsonArray.splice(index, 1);
            localStorage.setItem('itemsJson', JSON.stringify(itemJsonArray));
            updateTable();
        }

        document.getElementById("todoForm").addEventListener("submit", function (event) {
            event.preventDefault();  // Prevent form from reloading the page
            let tit = document.getElementById('title').value.trim();
            let desc = document.getElementById('description').value.trim();

            if (tit === "" || desc === "") {
                alert("Do you know that Shreya loved Sumit 💖💗🥰💞? If yes! then please fill both 🥺 ");
                return;
            }

            let itemJsonArray = localStorage.getItem('itemsJson');
            itemJsonArray = itemJsonArray ? JSON.parse(itemJsonArray) : [];
            itemJsonArray.push([tit, desc]);

            localStorage.setItem('itemsJson', JSON.stringify(itemJsonArray));
            document.getElementById('title').value = "";
            document.getElementById('description').value = "";
            updateTable();
        });

        document.addEventListener("DOMContentLoaded", updateTable);
        function clearstorage(){
            if (confirm("Do you really want to clear ?")){

            
            console.log('Clearing the storage')
            localStorage.clear();
            updateTable()
        }
    }
    </script>
</body>

</html>
